# Sobe a aplicação completa:  docker compose up --build
# Front: http://localhost:8501   API (docs): http://localhost:8000/docs
# Na 1ª execução o modelo é baixado (~2 GB para qwen2.5:3b) — aguarde o serviço "ollama-pull" terminar.
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"

  backend:
    build: ./backend
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8501}
      DATA_DIR: /data
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-150}
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  ollama_data:
  backend_data:
